name: covenant-pyth-policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/evidence/**"
      - "fixtures/apple-mainnet-canary-covenant.json"
      - "test/pyth-market-policy.test.mjs"
      - "scripts/pyth-stocklana-evidence.mjs"
      - "scripts/mainnet-canary-*.mjs"
      - "src/execution/mainnet-canary-helpers.mjs"
      - "package.json"
      - ".github/workflows/pyth-policy.yml"
  push:
    branches: [main]
    paths:
      - "src/evidence/**"
      - "fixtures/apple-mainnet-canary-covenant.json"
      - "test/pyth-market-policy.test.mjs"
      - "scripts/pyth-stocklana-evidence.mjs"
      - "scripts/mainnet-canary-*.mjs"
      - "src/execution/mainnet-canary-helpers.mjs"
      - "package.json"
      - ".github/workflows/pyth-policy.yml"

permissions:
  contents: read

jobs:
  deterministic-pyth-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic Pyth policy tests
        run: node --test test/pyth-market-policy.test.mjs
      - name: Syntax-check live Pyth probe
        run: node --check scripts/pyth-stocklana-evidence.mjs
      - name: Install JS dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify Solana token dependency compatibility
        run: node -e "Promise.all([import('@solana/web3.js'), import('@solana/spl-token')])"
      - name: Syntax-check mainnet scripts
        run: |
          node --check src/execution/mainnet-canary-helpers.mjs
          node --check scripts/mainnet-canary-preflight.mjs
          node --check scripts/mainnet-canary-setup.mjs
          node --check scripts/mainnet-canary-execute.mjs

  live-pyth-evidence:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live-pyth]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm required secrets are configured
        shell: bash
        run: |
          test -n "$PYTH_API_KEY" || { echo "PYTH_API_KEY repository secret is missing"; exit 1; }
          test -n "$JUPITER_API_KEY" || { echo "JUPITER_API_KEY repository secret is missing"; exit 1; }
          echo "Required repository secrets are configured."
      - name: Install JS dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Check Pyth feed entitlements
        run: node scripts/pyth-entitlement-check.mjs
      - name: Verify Jupiter API key and AAPLx quote path
        run: node scripts/jupiter-auth-check.mjs
      - name: Test Pyth Core and Benchmarks fallback
        run: node scripts/pyth-core-fallback-check.mjs
      - name: Test official Pyth Lazer WebSocket SDK
        continue-on-error: true
        env:
          LAZER_TOKEN: ${{ secrets.PYTH_API_KEY }}
        run: npm run probe:pyth:lazer
      - name: Capture live Pyth Stocklana evidence
        run: npm run probe:pyth
      - name: Upload live Pyth evidence
        uses: actions/upload-artifact@v4
        with:
          name: covenant-pyth-live-evidence
          path: evidence/pyth/*.json
          if-no-files-found: error
          retention-days: 14

  live-tsla-fallback:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live-tsla]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm required secrets are configured
        shell: bash
        run: |
          test -n "$PYTH_API_KEY" || { echo "PYTH_API_KEY repository secret is missing"; exit 1; }
          test -n "$JUPITER_API_KEY" || { echo "JUPITER_API_KEY repository secret is missing"; exit 1; }
      - name: Install JS dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run live TSLA fallback diagnostic
        run: node scripts/tsla-fallback-live-check.mjs
      - name: Upload TSLA fallback evidence
        uses: actions/upload-artifact@v4
        with:
          name: covenant-tsla-fallback-live-evidence
          path: evidence/tsla-fallback/*.json
          if-no-files-found: error
          retention-days: 14
