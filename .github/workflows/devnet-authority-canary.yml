name: covenant-devnet-authority-canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Setup Solana toolchain
        uses: solana-foundation/github-actions/setup-all@d1e779ca332fc499507fadf97d9c780ffed5a71f
        with:
          solana_version: "3.1.10"
          anchor_version: "1.1.2"
          node_version: "22"

      - name: Build minimal authority canary
        working-directory: canary
        run: cargo build-sbf

      - name: Measure canary
        shell: bash
        run: |
          set -euo pipefail
          SO="canary/target/deploy/covenant_canary.so"
          BYTES=$(wc -c < "$SO" | tr -d ' ')
          echo "canary_binary_bytes=$BYTES"
          solana rent "$BYTES" --url https://api.devnet.solana.com || true

      - name: Generate ephemeral devnet payer
        shell: bash
        run: |
          set -euo pipefail
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/covenant-devnet-payer.json
          echo "DEVNET_PAYER=$(solana-keygen pubkey /tmp/covenant-devnet-payer.json)" >> "$GITHUB_ENV"
          echo "PROGRAM_ID=$(solana-keygen pubkey canary/target/deploy/covenant_canary-keypair.json)" >> "$GITHUB_ENV"
          solana config set --url https://api.devnet.solana.com --keypair /tmp/covenant-devnet-payer.json >/dev/null

      - name: Obtain free devnet SOL
        shell: bash
        run: |
          set -uo pipefail
          TARGET=300000000

          balance() {
            solana balance "$DEVNET_PAYER" --lamports --url https://api.devnet.solana.com 2>/dev/null | awk '{print $1}' || echo 0
          }

          CURRENT=$(balance)
          echo "initial_lamports=$CURRENT"

          # Small requests are less likely to hit the public faucet's amount quota
          # than the 2 SOL request used by the first attempt.
          for AMOUNT in 0.3 0.2 0.1 0.05; do
            if [ "$CURRENT" -ge "$TARGET" ]; then break; fi
            solana airdrop "$AMOUNT" "$DEVNET_PAYER" --url https://api.devnet.solana.com || true
            sleep 4
            CURRENT=$(balance)
            echo "after_rpc_${AMOUNT}_lamports=$CURRENT"
          done

          # Helius publishes a shared devnet demo proxy. requestAirdrop may be
          # allowlisted there; if not, this is deliberately non-fatal.
          if [ "$CURRENT" -lt "$TARGET" ]; then
            curl -sS -X POST 'https://demo.helius.dev/api/rpc?network=devnet' \
              -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"requestAirdrop\",\"params\":[\"$DEVNET_PAYER\",400000000]}" \
              | tee /tmp/helius-airdrop.json || true
            sleep 8
            CURRENT=$(balance)
            echo "after_helius_demo_lamports=$CURRENT"
          fi

          # Final programmatic fallback recommended by Solana. It can be empty
          # at times, so failure here only becomes fatal if all sources failed.
          if [ "$CURRENT" -lt "$TARGET" ]; then
            cargo install devnet-pow || true
            if command -v devnet-pow >/dev/null 2>&1; then
              devnet-pow get-all-faucets -ud || true
              devnet-pow mine --target-lamports 400000000 -ud || true
            fi
            sleep 5
            CURRENT=$(balance)
            echo "after_pow_lamports=$CURRENT"
          fi

          if [ "$CURRENT" -lt "$TARGET" ]; then
            echo "No free programmatic devnet funding source was available."
            echo "DEVNET_FUNDED=false" >> "$GITHUB_ENV"
          else
            echo "DEVNET_FUNDED=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy minimal canary to devnet
        if: env.DEVNET_FUNDED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/devnet
          solana program deploy canary/target/deploy/covenant_canary.so             --program-id canary/target/deploy/covenant_canary-keypair.json             --keypair /tmp/covenant-devnet-payer.json             --url https://api.devnet.solana.com | tee evidence/devnet/deploy.txt
          solana program show "$PROGRAM_ID" --url https://api.devnet.solana.com | tee evidence/devnet/program-show.txt

      - name: Execute exact authorization and refuse replay
        if: env.DEVNET_FUNDED == 'true'
        env:
          COVENANT_DEVNET_PROGRAM_ID: ${{ env.PROGRAM_ID }}
          DEVNET_PAYER_KEYPAIR: /tmp/covenant-devnet-payer.json
          SOLANA_DEVNET_RPC_URL: https://api.devnet.solana.com
        run: node scripts/devnet-authority-canary.mjs

      - name: Record external funding block
        if: env.DEVNET_FUNDED != 'true'
        shell: bash
        run: |
          mkdir -p evidence/devnet
          cat > evidence/devnet/README.txt <<'EOF'
          BUILD_READY
          Minimal COVENANT devnet canary compiled successfully.
          Public deployment was skipped because no free programmatic devnet funding source was available to the GitHub-hosted runner.
          No devnet execution is claimed.
          EOF

      - name: Refuse secret material in artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/covenant-devnet-payer.json canary/target/deploy/covenant_canary-keypair.json
          if find evidence -type f \( -name '*keypair*' -o -name '*.secret*' \) | grep -q .; then
            echo "Refusing upload: secret-like file found"
            exit 1
          fi

      - name: Upload public devnet evidence
        uses: actions/upload-artifact@v4
        with:
          name: covenant-devnet-authority-evidence
          path: evidence/devnet/*
          if-no-files-found: error
          retention-days: 14
