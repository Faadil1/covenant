name: covenant-devnet-authority-canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "anchor/**"
      - "scripts/devnet-authority-canary.mjs"
      - ".github/workflows/devnet-authority-canary.yml"

permissions:
  contents: read

jobs:
  deploy-and-exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Setup Solana + Anchor
        uses: solana-foundation/github-actions/setup-all@d1e779ca332fc499507fadf97d9c780ffed5a71f
        with:
          solana_version: "3.1.10"
          anchor_version: "1.1.2"
          node_version: "22"

      - name: Generate ephemeral devnet identities
        shell: bash
        run: |
          set -euo pipefail
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/covenant-devnet-payer.json
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/covenant-devnet-program.json
          echo "PROGRAM_ID=$(solana-keygen pubkey /tmp/covenant-devnet-program.json)" >> "$GITHUB_ENV"
          echo "DEVNET_PAYER=$(solana-keygen pubkey /tmp/covenant-devnet-payer.json)" >> "$GITHUB_ENV"

      - name: Bind build to generated public Program ID
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/declare_id!\(\"[^\"]+\"\)/declare_id!(\"$PROGRAM_ID\")/" anchor/programs/covenant_runtime/src/lib.rs
          sed -i -E "s/covenant_runtime = \"[^\"]+\"/covenant_runtime = \"$PROGRAM_ID\"/g" anchor/Anchor.toml
          grep -F "declare_id!(\"$PROGRAM_ID\")" anchor/programs/covenant_runtime/src/lib.rs

      - name: Build COVENANT
        working-directory: anchor
        run: anchor build --ignore-keys

      - name: Fund ephemeral devnet payer
        shell: bash
        run: |
          set -euo pipefail
          solana config set --url https://api.devnet.solana.com --keypair /tmp/covenant-devnet-payer.json >/dev/null
          for attempt in 1 2 3 4; do
            solana airdrop 2 "$DEVNET_PAYER" --url https://api.devnet.solana.com && break
            sleep $((attempt * 4))
          done
          BALANCE=$(solana balance "$DEVNET_PAYER" --lamports --url https://api.devnet.solana.com | awk '{print $1}')
          echo "payer_lamports=$BALANCE"
          test "$BALANCE" -gt 1850000000

      - name: Deploy full authority boundary to devnet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/devnet
          solana program deploy anchor/target/deploy/covenant_runtime.so             --program-id /tmp/covenant-devnet-program.json             --keypair /tmp/covenant-devnet-payer.json             --url https://api.devnet.solana.com | tee evidence/devnet/deploy.txt
          solana program show "$PROGRAM_ID" --url https://api.devnet.solana.com | tee evidence/devnet/program-show.txt

      - name: Execute bounded authorization and refuse replay
        env:
          COVENANT_DEVNET_PROGRAM_ID: ${{ env.PROGRAM_ID }}
          DEVNET_PAYER_KEYPAIR: /tmp/covenant-devnet-payer.json
          SOLANA_DEVNET_RPC_URL: https://api.devnet.solana.com
        run: node scripts/devnet-authority-canary.mjs

      - name: Refuse secret material in artifact
        shell: bash
        run: |
          set -euo pipefail
          if find evidence -type f \( -name '*keypair*' -o -name '*.secret*' \) | grep -q .; then
            echo "Refusing upload: secret-like file found"
            exit 1
          fi
          rm -f /tmp/covenant-devnet-payer.json /tmp/covenant-devnet-program.json

      - name: Upload public devnet evidence
        uses: actions/upload-artifact@v4
        with:
          name: covenant-devnet-authority-evidence
          path: evidence/devnet/*
          if-no-files-found: error
          retention-days: 14
