name: covenant-technical-proof

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "fixtures/**"
      - "anchor/**"
      - "package.json"
      - ".github/workflows/technical-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: covenant-technical-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t1-claim-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run T1 live Claim Graph probe
        run: npm run probe:t1

      - name: Compare Apple and NVIDIA execution reality
        run: npm run probe:routes

      - name: Upload time-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covenant-t1-evidence
          path: evidence/t1/*.json
          if-no-files-found: warn
          retention-days: 14

  t4-migration-route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe direct Apple representation migration routes
        run: npm run probe:t4:migration-route
      - name: Upload time-bound T4 route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covenant-t4-route-evidence
          path: evidence/t4/*.json
          if-no-files-found: warn
          retention-days: 14

  t2-transition-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run deterministic transition-proof tests
        run: npm run test:t2

      - name: Run canonical ALLOW -> REFUSE proof demo
        run: npm run demo:t2

  t3-authority-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Solana + Anchor
        uses: solana-foundation/github-actions/setup-all@d1e779ca332fc499507fadf97d9c780ffed5a71f
        with:
          solana_version: "3.1.10"
          anchor_version: "1.1.2"
          node_version: "22"

      - name: Build COVENANT program
        working-directory: anchor
        run: anchor build --ignore-keys

      - name: Execute T3a LiteSVM authority-boundary tests
        working-directory: anchor
        run: cargo test --workspace -- --nocapture
