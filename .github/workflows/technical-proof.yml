name: covenant-technical-proof

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/technical-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t1-claim-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run T1 live Claim Graph probe
        run: npm run probe:t1

      - name: Upload time-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covenant-t1-evidence
          path: evidence/t1/runtime-*.json
          if-no-files-found: warn
          retention-days: 14
