name: covenant-submission-readiness

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "docs/SUBMISSION-PACK.md"
      - "docs/DEMO-SCRIPT-90S.md"
      - "docs/T4-SELF-HEALING.md"
      - "scripts/check-submission.mjs"
      - ".github/workflows/submission-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submission-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Stocklana submission truth and coverage
        run: node scripts/check-submission.mjs
