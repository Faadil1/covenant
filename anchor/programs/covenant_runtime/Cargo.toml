[package]
name = "covenant-runtime"
version = "0.1.0"
description = "COVENANT proof-gated economic state-transition authority boundary"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "covenant_runtime"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
